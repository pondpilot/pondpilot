name: Update PR with test results

on:
  workflow_run:
    workflows: ['Lint, Build & Test']
    types:
      - completed

# Privileged access to the repository
permissions:
  actions: read
  checks: write

jobs:
  update-pr:
    name: Update PR with test results
    runs-on: ubuntu-latest
    if: github.event.workflow_run.event == 'pull_request'

    steps:
      - name: Download Test Report
        uses: dawidd6/action-download-artifact@b6e2e70617bc3265edd6dab6c906732b2f1ae151 # v21
        with:
          name: playwright-merged-report
          run_id: ${{ github.event.workflow_run.id }}
          path: playwright-report
          if_no_artifact_found: fail
      - name: Publish Test Report
        uses: mikepenz/action-junit-report@d9f48fc87bc235f7e214acf696ca5abc0a986f16 # v6.4.2
        if: always()
        with:
          commit: ${{github.event.workflow_run.head_sha}}
          report_paths: 'playwright-report/results.xml'
          check_name: 'Integration Test Results'
