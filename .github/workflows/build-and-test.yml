# Runs linting, build & tests. Some artifacts are used in dependent privileged workflows.
name: Lint, Build & Test

on:
  # called on main from cloudflare pages deploy
  workflow_call:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'

      - name: Enable Corepack
        run: |
          corepack enable

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn config get cacheFolder)" >> $GITHUB_OUTPUT

      - name: Cache Yarn Dependencies
        uses: actions/cache@v4
        id: yarn-cache # use this to check for `cache-hit` (`steps.yarn-cache.outputs.cache-hit != 'true'`)
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Audit dependencies
        run: yarn npm audit --environment production --severity high

      - name: Type check
        run: yarn typecheck

      - name: Lint JS/TS
        run: yarn lint

      - name: Check for formatting issues
        run: yarn prettier

  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'

      - name: Enable Corepack
        run: |
          corepack enable

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn config get cacheFolder)" >> $GITHUB_OUTPUT

      - name: Cache Yarn Dependencies
        uses: actions/cache@v4
        id: yarn-cache # use this to check for `cache-hit` (`steps.yarn-cache.outputs.cache-hit != 'true'`)
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run unit tests
        run: yarn test:unit:coverage
        env:
          CI: true

      - name: Fetch pull request base for changed-line coverage
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags --depth=1 origin "${{ github.event.pull_request.base.sha }}"

      - name: Add coverage summary
        if: always()
        run: |
          node scripts/report-coverage.mjs --base="${{ github.event.pull_request.base.sha }}" --output=coverage/pr-summary.md
          cat coverage/pr-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload unit coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: unit-coverage
          path: |
            coverage/lcov.info
            coverage/coverage-summary.json
            coverage/pr-summary.md
          if-no-files-found: warn
          retention-days: 7

      - name: Install Playwright browsers
        run: yarn playwright install --with-deps chromium

      - name: Install DuckDB
        run: |
          curl https://install.duckdb.org | sh
          sudo ln -s /home/runner/.duckdb/cli/latest/duckdb /usr/local/bin/duckdb
          duckdb --version

      - name: Build for integration tests
        run: yarn build --mode int-test-build
        env:
          VITE_BUG_REPORT_PROXY_URL: ${{ vars.VITE_BUG_REPORT_PROXY_URL }}

      - name: Run Playwright tests
        run: |
          yarn playwright test
        env:
          CI: true

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Build for production
        run: yarn build
        env:
          VITE_BUG_REPORT_PROXY_URL: ${{ vars.VITE_BUG_REPORT_PROXY_URL }}

      - name: Check bundle size
        run: yarn check:bundle

      - name: Upload Build
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: dist
