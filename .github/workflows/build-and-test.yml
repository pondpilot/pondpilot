# Runs linting, build & tests. Some artifacts are used in dependent privileged workflows.
name: Lint, Build & Test

on:
  # called on main from cloudflare pages deploy
  workflow_call:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.node-version'

      - name: Enable Corepack
        run: |
          corepack enable

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn config get cacheFolder)" >> $GITHUB_OUTPUT

      - name: Cache Yarn Dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: yarn-cache # use this to check for `cache-hit` (`steps.yarn-cache.outputs.cache-hit != 'true'`)
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Audit dependencies
        run: yarn npm audit --environment production --severity high

      - name: Type check
        run: yarn typecheck

      - name: Lint JS/TS
        run: yarn lint

      - name: Check for formatting issues
        run: yarn prettier

  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.node-version'

      - name: Enable Corepack
        run: |
          corepack enable

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn config get cacheFolder)" >> $GITHUB_OUTPUT

      - name: Cache Yarn Dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: yarn-cache # use this to check for `cache-hit` (`steps.yarn-cache.outputs.cache-hit != 'true'`)
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run unit tests
        run: yarn test:unit:coverage
        env:
          CI: true

      - name: Run component tests
        run: yarn test:component
        env:
          CI: true

      - name: Install Playwright browsers
        run: yarn playwright install --with-deps chromium webkit

      - name: Install DuckDB
        run: |
          curl https://install.duckdb.org | sh
          sudo ln -s /home/runner/.duckdb/cli/latest/duckdb /usr/local/bin/duckdb
          duckdb --version

      - name: Cache deterministic test modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .module-cache
          key: ${{ runner.os }}-test-modules-${{ hashFiles('scripts/module-cache.mjs') }}-serial

      - name: Pre-seed DuckDB-WASM modules
        run: yarn cache:test-modules

      - name: Build for integration tests
        run: yarn build --mode int-test-build
        env:
          VITE_BUG_REPORT_PROXY_URL: ${{ vars.VITE_BUG_REPORT_PROXY_URL }}

      - name: Run Playwright tests
        run: |
          yarn playwright test --project=chromium
        env:
          CI: true

      - name: Upload serial Playwright artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: playwright-serial-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 7

      - name: Build for production
        run: yarn build
        env:
          VITE_BUG_REPORT_PROXY_URL: ${{ vars.VITE_BUG_REPORT_PROXY_URL }}

      - name: Check bundle size
        run: yarn check:bundle

      - name: Upload Build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build
          path: dist

  e2e-shard:
    name: Chromium shard ${{ matrix.shard }}/3 (shadow)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.node-version'

      - name: Enable Corepack
        run: corepack enable

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn config get cacheFolder)" >> $GITHUB_OUTPUT

      - name: Cache Yarn Dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Install Playwright Chromium
        run: yarn playwright install --with-deps chromium

      - name: Install DuckDB
        run: |
          curl https://install.duckdb.org | sh
          sudo ln -s /home/runner/.duckdb/cli/latest/duckdb /usr/local/bin/duckdb
          duckdb --version

      - name: Cache deterministic test modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .module-cache
          key: ${{ runner.os }}-test-modules-${{ hashFiles('scripts/module-cache.mjs') }}-shard-${{ matrix.shard }}

      - name: Build for integration tests
        run: yarn build --mode int-test-build
        env:
          VITE_BUG_REPORT_PROXY_URL: ${{ vars.VITE_BUG_REPORT_PROXY_URL }}

      - name: Run Chromium shard
        run: yarn test:e2e:shard --project=chromium --shard=${{ matrix.shard }}/3 --reporter=blob
        env:
          CI: true
          PLAYWRIGHT_BLOB_OUTPUT_FILE: blob-report/report-${{ matrix.shard }}.zip

      - name: Upload shard blob report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: playwright-blob-shard-${{ matrix.shard }}
          path: blob-report/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload shard failure artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: playwright-failures-shard-${{ matrix.shard }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  e2e-report:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build-test, e2e-shard]
    if: ${{ always() && github.event_name == 'pull_request' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.node-version'

      - name: Enable Corepack
        run: corepack enable

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn config get cacheFolder)" >> $GITHUB_OUTPUT

      - name: Cache Yarn Dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Verify local shard partition
        run: yarn check:e2e:shards

      - name: Download blob reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: playwright-blob-shard-*
          path: all-blob-reports
          merge-multiple: true

      - name: Download serial report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: playwright-serial-artifacts
          path: serial-artifacts

      - name: Verify all shard reports are present
        run: test "$(find all-blob-reports -name '*.zip' -type f | wc -l | tr -d ' ')" = '3'

      - name: Merge Playwright reports
        run: yarn playwright merge-reports --config=playwright.merge.config.ts all-blob-reports

      - name: Compare serial and sharded results
        run: >-
          yarn check:e2e:parity
          serial-artifacts/playwright-report/results.xml
          playwright-report/results.xml

      - name: Upload merged Playwright report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: playwright-merged-report
          path: playwright-report/
          if-no-files-found: warn
          retention-days: 7

      - name: Require all shards to pass
        if: always()
        run: |
          test '${{ needs.build-test.result }}' = 'success'
          test '${{ needs.e2e-shard.result }}' = 'success'
